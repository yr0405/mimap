<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WanderMap 沖繩自由行排程版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            overscroll-behavior-y: none; 
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        
        .timeline-line {
            position: absolute;
            left: 23px;
            top: 40px;
            bottom: -30px;
            width: 2px;
            background-color: #e2e8f0;
            z-index: 0;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="text"], input[type="password"], textarea { font-size: 16px; } /* 防止 iOS 自動放大 */
        
        /* 支援 iOS 底部安全距離 (Safe Area) */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 1.5rem); }
        }
        @supports not (padding-bottom: env(safe-area-inset-bottom)) {
            .pb-safe { padding-bottom: 1.5rem; }
        }
    </style>
</head>
<body class="fixed inset-0 w-full flex flex-col md:flex-row overflow-hidden text-slate-800 bg-slate-50">

    <!-- 🔒 安全鎖屏畫面 -->
    <div id="lock-screen" class="fixed inset-0 bg-slate-900/95 backdrop-blur-md z-[999] flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="bg-white p-8 rounded-3xl shadow-2xl flex flex-col items-center max-w-sm w-[90%] transform transition-transform duration-300 scale-100" id="lock-box">
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-3xl mb-5 shadow-inner">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2 class="text-xl font-bold text-gray-800 mb-1">私人行程表</h2>
            <p class="text-sm text-gray-500 mb-6 text-center">請輸入通行密碼以解鎖內容</p>
            
            <input type="password" id="passcode-input" class="w-full bg-slate-50 border border-slate-200 text-center text-2xl tracking-[0.5em] rounded-xl px-4 py-3 outline-none focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-50 transition-all mb-4 font-mono" placeholder="••••" onkeypress="if(event.key === 'Enter') unlockApp()">
            
            <button onclick="unlockApp()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition-all shadow-md hover:shadow-lg active:scale-95 flex justify-center items-center gap-2">
                <i class="fa-solid fa-unlock-keyhole"></i> 解鎖進入
            </button>
            <p id="lock-error" class="text-red-500 text-sm mt-4 hidden bg-red-50 px-3 py-1 rounded-full"><i class="fa-solid fa-circle-xmark mr-1"></i> 密碼錯誤，請重試</p>
        </div>
    </div>

    <!-- 地圖區塊 -->
    <div class="h-[35%] md:h-full md:flex-1 shrink-0 relative z-0 bg-slate-200 order-1 md:order-2">
        <div id="map" class="w-full h-full"></div>
    </div>

    <!-- 左側(或下方)行程面板 -->
    <div class="flex-1 md:h-full w-full md:w-[450px] lg:w-[500px] bg-white flex flex-col shadow-[0_-5px_20px_rgba(0,0,0,0.1)] md:shadow-xl z-10 relative order-2 md:order-1 rounded-t-3xl md:rounded-none overflow-hidden">
        
        <div class="md:hidden w-full flex justify-center pt-3 pb-1 shrink-0">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full"></div>
        </div>

        <div class="px-5 pt-2 md:pt-6 pb-2 border-b border-gray-100 shrink-0 bg-white">
            <div class="flex justify-between items-start mb-2">
                <div>
                    <h1 class="text-xl md:text-2xl font-bold text-blue-600 flex items-center gap-2">
                        沖繩五日遊 🌺
                    </h1>
                    <p class="text-xs md:text-sm text-gray-500 mt-1">2026.10.16 - 2026.10.20</p>
                </div>
                <div class="flex flex-col gap-2 items-end">
                    <button onclick="toggleMemoModal()" class="bg-amber-100 text-amber-700 hover:bg-amber-200 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors shadow-sm flex items-center gap-2">
                        <i class="fa-solid fa-clipboard-list"></i> <span class="hidden sm:inline">備忘錄</span>
                    </button>
                    <!-- 新增：上鎖與重設按鈕區 -->
                    <div class="flex gap-3">
                        <button onclick="lockApp()" class="text-xs text-slate-400 hover:text-blue-500 transition-colors"><i class="fa-solid fa-lock mr-1"></i>上鎖</button>
                        <button onclick="factoryReset()" class="text-xs text-slate-400 hover:text-red-500 transition-colors"><i class="fa-solid fa-rotate-right mr-1"></i>重設</button>
                    </div>
                </div>
            </div>
            
            <div class="flex gap-2 overflow-x-auto mt-3 hide-scrollbar pb-2" id="day-tabs"></div>
        </div>

        <!-- 新增景點輸入區 -->
        <div class="px-5 py-3 bg-slate-50 border-b border-gray-200 flex gap-2 shrink-0 shadow-sm z-20">
            <div class="flex-1 flex flex-col gap-2">
                <input type="text" id="new-place-name" placeholder="輸入景點名稱 (如: 美國村)" class="w-full bg-white border border-slate-300 text-sm rounded-lg px-3 py-2 outline-none focus:border-blue-500 transition-colors shadow-sm" onkeypress="if(event.key === 'Enter') addNewPlace()">
                <input type="text" id="new-place-note" placeholder="備註或營業時間 (選填)" class="w-full bg-white border border-slate-300 text-sm rounded-lg px-3 py-1.5 outline-none focus:border-blue-500 transition-colors shadow-sm" onkeypress="if(event.key === 'Enter') addNewPlace()">
            </div>
            <button onclick="addNewPlace()" class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-4 font-medium transition-colors shadow-sm whitespace-nowrap flex flex-col items-center justify-center gap-1 min-w-[70px]">
                <i class="fa-solid fa-plus"></i>
                <span class="text-xs">新增</span>
            </button>
        </div>

        <!-- 行程列表區塊 -->
        <div class="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-6 relative bg-slate-50/50 pb-safe" id="itinerary-panel"></div>
    </div>

    <!-- 旅遊備忘錄 Modal -->
    <div id="memo-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex justify-center items-end md:items-center p-0 md:p-4 backdrop-blur-sm transition-opacity duration-300 opacity-0">
        <div id="memo-content" class="bg-white w-full md:max-w-2xl h-[85vh] md:h-[80vh] rounded-t-3xl md:rounded-2xl flex flex-col shadow-2xl transform translate-y-full md:translate-y-0 transition-transform duration-300 relative pointer-events-auto">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50 rounded-t-3xl md:rounded-t-2xl shrink-0">
                <h2 class="text-lg md:text-xl font-bold text-gray-800"><i class="fa-solid fa-pen-to-square text-blue-500 mr-2"></i>行前資訊與備忘錄</h2>
                <button onclick="toggleMemoModal()" class="text-gray-400 hover:text-gray-600 w-8 h-8 flex justify-center items-center rounded-full hover:bg-gray-200 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto custom-scrollbar flex-1 bg-white space-y-6 text-sm pb-safe">
                <div class="bg-blue-50 rounded-xl p-4 border border-blue-100">
                    <h3 class="font-bold text-blue-800 text-base mb-2 flex items-center"><i class="fa-solid fa-hotel mr-2"></i>住宿資訊</h3>
                    <textarea id="hotel-text" oninput="saveHotelText()" class="w-full bg-transparent text-blue-900 border-none outline-none focus:ring-2 focus:ring-blue-300 rounded p-1 resize-none h-32 leading-relaxed" placeholder="輸入住宿資訊..."></textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <h3 class="font-bold text-gray-800 border-b-2 border-green-400 pb-1 mb-3 inline-block">✅ 旅遊待辦清單</h3>
                        <ul id="todo-list" class="space-y-2 text-gray-600"></ul>
                    </div>
                    <div>
                        <h3 class="font-bold text-gray-800 border-b-2 border-orange-400 pb-1 mb-3 inline-block">🎒 行李檢查表</h3>
                        <ul id="packing-list" class="space-y-2 text-gray-600"></ul>
                    </div>
                </div>
                <div>
                    <h3 class="font-bold text-gray-800 border-b-2 border-pink-400 pb-1 mb-3 inline-block">🛍️ 購物採買清單</h3>
                    <ul id="shopping-list" class="space-y-2 text-gray-600"></ul>
                </div>
            </div>
        </div>
    </div>

    <!-- 訊息提示 Toast -->
    <div id="toast-container" class="fixed bottom-[max(20px,env(safe-area-inset-bottom))] left-1/2 transform -translate-x-1/2 z-[100] transition-all duration-300 opacity-0 pointer-events-none flex flex-col gap-2"></div>

    <!-- 自訂確認對話框 -->
    <div id="confirm-modal" class="fixed inset-0 bg-black/50 z-[100] hidden flex justify-center items-center backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl p-6 w-[90%] max-w-sm shadow-2xl transform scale-95 transition-transform duration-300" id="confirm-box">
            <h3 class="text-lg font-bold text-gray-800 mb-2">⚠️ 確定要執行嗎？</h3>
            <p class="text-gray-600 text-sm mb-6" id="confirm-message">這項操作無法復原。</p>
            <div class="flex justify-end gap-3">
                <button onclick="closeConfirm()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-sm font-medium transition-colors">取消</button>
                <button id="confirm-action-btn" class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg text-sm font-medium transition-colors">確定執行</button>
            </div>
        </div>
    </div>

    <!-- Leaflet Map JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ==========================================
        // 🔒 密碼安全設定區塊
        // ==========================================
        // ★★★ 請在這裡修改你的專屬密碼 ★★★
        const APP_PASSWORD = "1234"; 
        
        function checkLockStatus() {
            const lockScreen = document.getElementById('lock-screen');
            // 檢查 localStorage 是否有解鎖紀錄
            if (localStorage.getItem('wanderMap_Unlocked') === 'true') {
                lockScreen.style.display = 'none'; // 直接隱藏，不播動畫以求順暢
            } else {
                lockScreen.style.display = 'flex';
                // 延遲 Focus 密碼框
                setTimeout(() => document.getElementById('passcode-input').focus(), 100);
            }
        }

        function unlockApp() {
            const input = document.getElementById('passcode-input').value;
            const errorMsg = document.getElementById('lock-error');
            const lockBox = document.getElementById('lock-box');
            
            if (input === APP_PASSWORD) {
                // 密碼正確，存入 localStorage
                localStorage.setItem('wanderMap_Unlocked', 'true');
                const lockScreen = document.getElementById('lock-screen');
                lockScreen.classList.add('opacity-0');
                setTimeout(() => lockScreen.style.display = 'none', 500);
            } else {
                // 密碼錯誤，顯示錯誤與震動特效
                errorMsg.classList.remove('hidden');
                document.getElementById('passcode-input').value = '';
                
                // 簡單的 CSS 震動特效
                lockBox.style.transform = 'translateX(-10px)';
                setTimeout(() => lockBox.style.transform = 'translateX(10px)', 50);
                setTimeout(() => lockBox.style.transform = 'translateX(-10px)', 100);
                setTimeout(() => lockBox.style.transform = 'translateX(10px)', 150);
                setTimeout(() => lockBox.style.transform = 'translateX(0)', 200);

                setTimeout(() => errorMsg.classList.add('hidden'), 2000);
            }
        }

        function lockApp() {
            // 清除解鎖紀錄並重新整理網頁
            localStorage.removeItem('wanderMap_Unlocked');
            location.reload();
        }
        // ==========================================


        // 預設的所有景點資料
        const defaultPool = [
            { id: 1, name: "那霸機場", lat: 26.2063, lng: 127.6514, note: "抵達沖繩，領取行李 / 出境", icon: "fa-plane", color: "text-blue-500", bg: "bg-blue-100" },
            { id: 2, name: "Prince Smart Inn Naha", lat: 26.2185, lng: 127.6797, note: "住宿 Check-in。善用單軌一日券", icon: "fa-hotel", color: "text-purple-500", bg: "bg-purple-100" },
            { id: 3, name: "國際通商圈", lat: 26.2166, lng: 127.6848, note: "逛街、買薯條三兄弟 (第一牧志市場周邊)", icon: "fa-bag-shopping", color: "text-pink-500", bg: "bg-pink-100" },
            { id: 4, name: "金澤壽司 (縣政廳站)", lat: 26.2148, lng: 127.6789, note: "晚餐：美味壽司", icon: "fa-utensils", color: "text-red-500", bg: "bg-red-100" },
            { id: 5, name: "Cream D 生甜甜圈", lat: 26.2230, lng: 127.6976, note: "歌町站。人氣口味：抹茶、紅豆 (DSF旁)", icon: "fa-cookie-bite", color: "text-yellow-500", bg: "bg-yellow-100" },
            { id: 6, name: "白色麥當勞 (壺屋店)", lat: 26.2120, lng: 127.6917, note: "沖繩限定白色麥當勞 (姬百合通壺屋店)", icon: "fa-burger", color: "text-orange-500", bg: "bg-orange-100" },
            { id: 7, name: "安次富文具店 (牧志)", lat: 26.2173, lng: 127.6833, note: "採買文具 (Yasugiya Shop Pro)", icon: "fa-pen-ruler", color: "text-emerald-500", bg: "bg-emerald-100" },
            { id: 8, name: "西來院達摩寺", lat: 26.2195, lng: 127.7214, note: "首里城站走路10分鐘", icon: "fa-vihara", color: "text-red-600", bg: "bg-red-100" },
            { id: 9, name: "CARTOLERIA 文具", lat: 26.2148, lng: 127.6788, note: "Palette Kumoji 8F (縣廳前站)", icon: "fa-pen-clip", color: "text-emerald-500", bg: "bg-emerald-100" },
            { id: 10, name: "Shisa Cookie", lat: 26.2141, lng: 127.6799, note: "風獅爺造型曲奇餅 (縣政廳站 松尾1-1-1)", icon: "fa-cookie", color: "text-orange-500", bg: "bg-orange-100" },
            { id: 11, name: "大創 AEON那霸店", lat: 26.1963, lng: 127.6660, note: "小祿站旁，大量採買泡澡球 (約100日圓)", icon: "fa-store", color: "text-purple-500", bg: "bg-purple-100" },
            { id: 12, name: "吉野家 (壺屋店)", lat: 26.2115, lng: 127.6920, note: "百合之姬通店", icon: "fa-bowl-rice", color: "text-orange-600", bg: "bg-orange-100" },
            { id: 13, name: "獅薩伴手禮店", lat: 26.2063, lng: 127.6514, note: "那霸機場內 2W-06區", icon: "fa-gift", color: "text-pink-500", bg: "bg-pink-100" }
        ];

        let appState = {
            unscheduled: JSON.parse(JSON.stringify(defaultPool)),
            days: [ [], [], [], [], [] ] 
        };

        const savedData = localStorage.getItem('wanderMapV4_Data');
        if (savedData) {
            try { appState = JSON.parse(savedData); } catch(e) { console.error("Data parse error"); }
        }

        let currentTab = -1; 
        let confirmActionCallback = null;

        function showMessage(msg, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-4 py-2 rounded-full shadow-lg text-sm font-medium text-white ${isError ? 'bg-red-500' : 'bg-gray-800'} transform translate-y-4 opacity-0 transition-all duration-300 flex items-center mb-2`;
            toast.innerHTML = isError ? `<i class="fa-solid fa-circle-exclamation mr-2"></i>${msg}` : `<i class="fa-solid fa-circle-check mr-2 text-green-400"></i>${msg}`;
            container.appendChild(toast);
            
            container.classList.remove('opacity-0');
            setTimeout(() => toast.classList.remove('translate-y-4', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function showConfirm(message, callback) {
            document.getElementById('confirm-message').textContent = message;
            confirmActionCallback = callback;
            const modal = document.getElementById('confirm-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                document.getElementById('confirm-box').classList.remove('scale-95');
            }, 10);
            
            document.getElementById('confirm-action-btn').onclick = () => {
                closeConfirm();
                if (confirmActionCallback) confirmActionCallback();
            };
        }

        function closeConfirm() {
            const modal = document.getElementById('confirm-modal');
            modal.classList.add('opacity-0');
            document.getElementById('confirm-box').classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        async function addNewPlace() {
            const nameInput = document.getElementById('new-place-name');
            const noteInput = document.getElementById('new-place-note');
            const name = nameInput.value.trim();
            const note = noteInput.value.trim();

            if (!name) { showMessage('請輸入景點名稱！', true); return; }

            const btn = document.querySelector('button[onclick="addNewPlace()"]');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span class="text-xs">搜尋中</span>';
            btn.disabled = true;

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(name)}&limit=1`);
                const data = await response.json();

                let lat = 26.2123; 
                let lng = 127.6792;
                
                if (data && data.length > 0) {
                    lat = parseFloat(data[0].lat);
                    lng = parseFloat(data[0].lon);
                    showMessage(`成功加入「${name}」並找到座標！`);
                } else {
                    showMessage(`找不到精確座標，已暫時放置於市區。`, true);
                }

                const newPlace = { id: Date.now(), name: name, lat: lat, lng: lng, note: note, icon: "fa-map-pin", color: "text-teal-600", bg: "bg-teal-100" };

                if (currentTab === -1) { appState.unscheduled.unshift(newPlace); } 
                else { appState.days[currentTab].push(newPlace); }

                saveState(); renderTabs(); renderItinerary();
                nameInput.value = ''; noteInput.value = '';
                
            } catch (err) {
                showMessage('網路異常，已手動強制加入。', true);
                const newPlace = { id: Date.now(), name: name, lat: 26.2123, lng: 127.6792, note: note, icon: "fa-map-pin", color: "text-teal-600", bg: "bg-teal-100" };
                if (currentTab === -1) appState.unscheduled.unshift(newPlace);
                else appState.days[currentTab].push(newPlace);
                saveState(); renderTabs(); renderItinerary();
                nameInput.value = ''; noteInput.value = '';
            } finally {
                btn.innerHTML = originalHTML; btn.disabled = false;
            }
        }

        function saveState() { localStorage.setItem('wanderMapV4_Data', JSON.stringify(appState)); }

        function factoryReset() {
            showConfirm("確定要重設所有行程嗎？景點將會回到預設狀態。", () => {
                localStorage.removeItem('wanderMapV4_Data');
                appState = {
                    unscheduled: JSON.parse(JSON.stringify(defaultPool)),
                    days: [ [], [], [], [], [] ]
                };
                currentTab = -1;
                renderTabs(); renderItinerary(); showMessage("資料已成功重設。");
            });
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('day-tabs');
            tabsContainer.innerHTML = '';
            
            const unscheduledActive = currentTab === -1 ? 'bg-amber-500 text-white shadow-md' : 'bg-white border border-gray-200 text-gray-600 hover:bg-gray-50';
            tabsContainer.innerHTML += `
                <button onclick="switchTab(-1)" class="whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-semibold transition-all ${unscheduledActive}">
                    📍 待安排 (${appState.unscheduled.length})
                </button>`;

            appState.days.forEach((day, index) => {
                const isActive = index === currentTab;
                const activeClass = isActive ? 'bg-blue-600 text-white shadow-md' : 'bg-white border border-gray-200 text-gray-600 hover:bg-gray-50';
                tabsContainer.innerHTML += `
                    <button onclick="switchTab(${index})" class="whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-semibold transition-all ${activeClass}">
                        Day ${index + 1} (${day.length})
                    </button>`;
            });
        }

        function switchTab(index) {
            currentTab = index; renderTabs(); renderItinerary();
            document.getElementById('itinerary-panel').scrollTop = 0;
        }

        function moveItemToDay(fromTab, index, toTabStr) {
            const toTab = parseInt(toTabStr);
            if(isNaN(toTab) || fromTab === toTab) return;

            let item = fromTab === -1 ? appState.unscheduled.splice(index, 1)[0] : appState.days[fromTab].splice(index, 1)[0];
            if (toTab === -1) { appState.unscheduled.push(item); } else { appState.days[toTab].push(item); }

            saveState(); renderTabs(); renderItinerary(); showMessage("景點移動成功！");
        }

        function reorderItem(tab, index, direction) {
            let list = tab === -1 ? appState.unscheduled : appState.days[tab];
            if (direction === -1 && index > 0) {
                [list[index - 1], list[index]] = [list[index], list[index - 1]];
            } else if (direction === 1 && index < list.length - 1) {
                [list[index + 1], list[index]] = [list[index], list[index + 1]];
            }
            saveState(); renderItinerary();
        }
        
        function deleteItem(tab, index) {
            showConfirm("確定要刪除這個景點嗎？", () => {
                if (tab === -1) { appState.unscheduled.splice(index, 1); } else { appState.days[tab].splice(index, 1); }
                saveState(); renderTabs(); renderItinerary(); showMessage("景點已刪除");
            });
        }

        function renderItinerary() {
            const container = document.getElementById('itinerary-panel');
            container.innerHTML = '';
            
            const list = currentTab === -1 ? appState.unscheduled : appState.days[currentTab];

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-gray-400 pb-10">
                        <i class="fa-solid fa-map-location-dot text-4xl mb-3 text-gray-300"></i>
                        <p>此區塊目前沒有景點</p>
                        <p class="text-xs mt-1">請從上方新增，或從「待安排」移入</p>
                    </div>`;
                updateMap(list); return;
            }

            list.forEach((place, index) => {
                const isLast = index === list.length - 1;
                const showTimeline = currentTab !== -1 && !isLast; 
                
                let itemHTML = `
                <div class="relative flex gap-3 mb-1 group">
                    ${showTimeline ? '<div class="timeline-line"></div>' : ''}
                    
                    <div class="flex flex-col items-center z-10 w-[40px] shrink-0">
                        <div class="w-10 h-10 rounded-full ${place.bg} ${place.color} flex justify-center items-center shadow-sm border-2 border-white ring-1 ring-gray-100 z-10">
                            <i class="fa-solid ${place.icon} text-sm"></i>
                        </div>
                    </div>
                    
                    <div class="flex-1 bg-white border border-gray-100 p-3.5 rounded-2xl shadow-sm relative z-10 mb-2 transition-shadow hover:shadow-md">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-gray-800 text-base leading-tight">${place.name}</h3>
                            <button onclick="deleteItem(${currentTab}, ${index})" class="text-gray-300 hover:text-red-500 transition-colors p-1" title="刪除景點"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        ${place.note ? `<div class="mt-2 text-xs text-gray-600 bg-gray-50 p-2 rounded-lg border border-gray-100 leading-relaxed"><i class="fa-solid fa-circle-info text-blue-400 mr-1.5"></i>${place.note}</div>` : ''}
                        
                        <div class="flex justify-between items-center mt-3 pt-2 border-t border-gray-50">
                            <div class="flex gap-1">
                                <button onclick="reorderItem(${currentTab}, ${index}, -1)" class="w-7 h-7 flex items-center justify-center bg-gray-50 hover:bg-gray-200 rounded text-gray-500 transition-colors" ${index === 0 ? 'disabled style="opacity:0.3"' : ''} title="向上移動"><i class="fa-solid fa-arrow-up text-xs"></i></button>
                                <button onclick="reorderItem(${currentTab}, ${index}, 1)" class="w-7 h-7 flex items-center justify-center bg-gray-50 hover:bg-gray-200 rounded text-gray-500 transition-colors" ${isLast ? 'disabled style="opacity:0.3"' : ''} title="向下移動"><i class="fa-solid fa-arrow-down text-xs"></i></button>
                            </div>
                            
                            <select onchange="moveItemToDay(${currentTab}, ${index}, this.value)" class="text-xs bg-slate-100 text-slate-700 border-none rounded-lg px-2 py-1 outline-none cursor-pointer font-medium hover:bg-slate-200 transition-colors">
                                <option value="" disabled selected>移動景點至...</option>
                                <option value="-1" ${currentTab===-1?'disabled':''}>📍 待安排清單</option>
                                <option value="0" ${currentTab===0?'disabled':''}>Day 1</option>
                                <option value="1" ${currentTab===1?'disabled':''}>Day 2</option>
                                <option value="2" ${currentTab===2?'disabled':''}>Day 3</option>
                                <option value="3" ${currentTab===3?'disabled':''}>Day 4</option>
                                <option value="4" ${currentTab===4?'disabled':''}>Day 5</option>
                            </select>
                        </div>
                    </div>
                </div>`;
                container.insertAdjacentHTML('beforeend', itemHTML);

                if (showTimeline) {
                    const nextPlace = list[index + 1];
                    const navHTML = `
                    <div class="relative pl-[3.5rem] pr-2 py-1.5 z-10 w-full flex items-center gap-3">
                        <div class="bg-white border border-gray-200 rounded-full px-4 py-1.5 flex items-center gap-4 shadow-sm">
                            <a href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(place.name)}&destination=${encodeURIComponent(nextPlace.name)}&travelmode=driving" target="_blank" class="text-gray-400 hover:text-blue-500 transition-colors" title="開車導航"><i class="fa-solid fa-car text-sm"></i></a>
                            <div class="w-px h-3 bg-gray-200"></div>
                            <a href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(place.name)}&destination=${encodeURIComponent(nextPlace.name)}&travelmode=transit" target="_blank" class="text-gray-400 hover:text-green-600 transition-colors" title="大眾運輸"><i class="fa-solid fa-train-subway text-sm"></i></a>
                            <div class="w-px h-3 bg-gray-200"></div>
                            <a href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(place.name)}&destination=${encodeURIComponent(nextPlace.name)}&travelmode=walking" target="_blank" class="text-gray-400 hover:text-orange-500 transition-colors" title="步行導航"><i class="fa-solid fa-person-walking text-sm"></i></a>
                        </div>
                    </div>`;
                    container.insertAdjacentHTML('beforeend', navHTML);
                }
            });
            updateMap(list);
        }

        let map = L.map('map', { zoomControl: false }).setView([26.2123, 127.6792], 13);
        L.control.zoom({ position: 'topright' }).addTo(map);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
        window.addEventListener('resize', () => { setTimeout(() => map.invalidateSize(), 200); });

        let currentMarkers = [];
        let currentPolyline = null;

        function clearMap() {
            currentMarkers.forEach(marker => map.removeLayer(marker));
            currentMarkers = [];
            if (currentPolyline) { map.removeLayer(currentPolyline); currentPolyline = null; }
        }

        function updateMap(list) {
            clearMap();
            const bounds = [];
            const latlngs = [];

            list.forEach((place, index) => {
                if (place.lat && place.lng) {
                    const latlng = [place.lat, place.lng];
                    latlngs.push(latlng); bounds.push(latlng);
                    const markerText = currentTab === -1 ? '<i class="fa-solid fa-location-dot"></i>' : (index + 1);
                    const bgColor = currentTab === -1 ? 'bg-amber-500' : 'bg-blue-600';
                    const markerHtml = `<div class="${bgColor} text-white w-6 h-6 rounded-full flex justify-center items-center font-bold shadow-lg border-2 border-white text-xs">${markerText}</div>`;
                    const customIcon = L.divIcon({ html: markerHtml, className: '', iconSize: [24, 24], iconAnchor: [12, 12] });
                    const marker = L.marker(latlng, {icon: customIcon}).bindPopup(`<b class="text-sm">${place.name}</b>`).addTo(map);
                    currentMarkers.push(marker);
                }
            });

            if (currentTab !== -1 && latlngs.length > 1) {
                currentPolyline = L.polyline(latlngs, { color: '#3b82f6', weight: 4, opacity: 0.8, dashArray: '8, 8', lineJoin: 'round' }).addTo(map);
            }

            setTimeout(() => {
                map.invalidateSize();
                if (bounds.length > 0) { map.fitBounds(L.latLngBounds(bounds), { padding: [30, 30], maxZoom: 15 }); }
            }, 100);
        }

        const defaultMemoData = {
            hotel: "Prince Smart Inn Naha\n📍 沖繩縣那霸市松山2-4-13\n交通建議：多善用「單軌電車 24 小時一日券」；前往美國村可至「縣廳前」或「那霸巴士總站」搭乘路線公車。\n1F 行李空間\n4F 自動販賣機 製冰器 微波爐\n5F 洗衣角（收費/2台）",
            todo: [ { text: "買旅平險", done: false }, { text: "買ESIM列印QRCode", done: false }, { text: "換日幣70000", done: false }, { text: "列印機票", done: false }, { text: "入境VISA", done: false }, { text: "加入外交部領事line", done: false } ],
            packing: [ { text: "護照、機票影本", done: false }, { text: "ESIM、日幣現金、信用卡兩張", done: false }, { text: "眼鏡盒、行動電源、充電線、充電器", done: false }, { text: "行李箱+行李套+手提行李袋", done: false }, { text: "旅行組：洗臉/洗髮/牙膏/牙刷/保養", done: false }, { text: "短袖x5、長褲x2、外套x1", done: false }, { text: "睡衣褲x1、內衣褲x5、襪子x5", done: false } ],
            shopping: [ { text: "泡澡球：大創 (AEON那霸店/小祿站)，約100日圓未稅", done: false }, { text: "文具：安次富文具店、CARTOLERIA", done: false }, { text: "國際通：薯條三兄弟", done: false }, { text: "藥妝：ok繃", done: false }, { text: "相片列印紙CP1500:KC-18IL 8格貼紙18張", done: false }, { text: "那霸機場：獅薩伴手禮店 隨意買", done: false }, { text: "伴手禮：Shisa Cookie 風獅爺造型曲奇", done: false } ]
        };

        let currentMemoData = JSON.parse(localStorage.getItem('wanderMapV4_Memo')) || JSON.parse(JSON.stringify(defaultMemoData));

        function saveMemo() { localStorage.setItem('wanderMapV4_Memo', JSON.stringify(currentMemoData)); }
        function saveHotelText() { currentMemoData.hotel = document.getElementById('hotel-text').value; saveMemo(); }
        function toggleMemoCheckbox(cat, idx) { currentMemoData[cat][idx].done = !currentMemoData[cat][idx].done; saveMemo(); renderMemoCategory(cat); }
        function updateMemoText(cat, idx, text) { currentMemoData[cat][idx].text = text; saveMemo(); }
        function deleteMemoItem(cat, idx) { currentMemoData[cat].splice(idx, 1); saveMemo(); renderMemoCategory(cat); }
        
        function addMemoItem(cat) {
            currentMemoData[cat].push({ text: "", done: false });
            saveMemo(); renderMemoCategory(cat);
            setTimeout(() => {
                const inputs = document.getElementById(`${cat}-list`).querySelectorAll('input[type="text"]');
                if(inputs.length > 0) inputs[inputs.length - 1].focus();
            }, 50);
        }

        function renderMemoCategory(category) {
            const container = document.getElementById(`${category}-list`);
            let html = '';
            let colorClass = category === 'todo' ? 'text-green-600 focus:ring-green-500' : category === 'packing' ? 'text-orange-500 focus:ring-orange-500' : 'text-pink-500 focus:ring-pink-500';

            currentMemoData[category].forEach((item, index) => {
                const textStyle = item.done ? 'line-through text-gray-400' : 'text-gray-700';
                html += `
                    <li class="flex gap-2 items-start group">
                        <input type="checkbox" class="mt-1.5 w-4 h-4 rounded border-gray-300 ${colorClass}" ${item.done ? 'checked' : ''} onchange="toggleMemoCheckbox('${category}', ${index})">
                        <input type="text" class="flex-1 bg-transparent border-b border-transparent focus:border-gray-200 outline-none px-1 py-0.5 transition-colors ${textStyle}" value="${item.text}" oninput="updateMemoText('${category}', ${index}, this.value)" placeholder="輸入內容...">
                        <button onclick="deleteMemoItem('${category}', ${index})" class="text-gray-300 hover:text-red-500 md:opacity-0 group-hover:opacity-100 transition-opacity p-1 focus:opacity-100"><i class="fa-solid fa-trash-can text-sm"></i></button>
                    </li>`;
            });
            html += `<li class="flex gap-2 items-center text-sm text-gray-400 cursor-pointer hover:text-blue-500 mt-2 px-1 transition-colors w-max" onclick="addMemoItem('${category}')"><i class="fa-solid fa-plus"></i> 新增項目...</li>`;
            container.innerHTML = html;
        }

        function renderAllMemos() {
            document.getElementById('hotel-text').value = currentMemoData.hotel;
            renderMemoCategory('todo'); renderMemoCategory('packing'); renderMemoCategory('shopping');
        }

        function toggleMemoModal() {
            const modal = document.getElementById('memo-modal');
            if (modal.classList.contains('hidden')) {
                renderAllMemos();
                modal.classList.remove('hidden');
                setTimeout(() => { modal.classList.remove('opacity-0'); document.getElementById('memo-content').classList.remove('translate-y-full'); }, 10);
            } else {
                modal.classList.add('opacity-0');
                document.getElementById('memo-content').classList.add('translate-y-full');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }
        }

        // 初始化
        window.onload = () => {
            checkLockStatus(); // ★ 檢查安全鎖狀態
            renderTabs();
            renderItinerary();
        };
    </script>
</body>
</html>
