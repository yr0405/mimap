<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WanderMap 自由行小幫手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: 'Inter', 'PingFang TC', 'Microsoft JhengHei', sans-serif; -webkit-tap-highlight-color: transparent; }
        .safe-pb { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .map-line { stroke-dasharray: 5, 5; animation: dash 20s linear infinite; }
        @keyframes dash { to { stroke-dashoffset: -1000; } }
        @keyframes highlightCard {
            0% { box-shadow: 0 0 0 2px #3b82f6; transform: scale(1.02); }
            100% { box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05); transform: scale(1); }
        }
        .highlight-card { animation: highlightCard 1.5s ease-out; }
    </style>
</head>
<body class="bg-gray-100 h-[100dvh] w-screen overflow-hidden fixed inset-0 flex flex-col">

    <div id="lock-screen" class="fixed inset-0 bg-slate-900 z-[100] flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-11/12 max-w-sm text-center">
            <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-600 text-2xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">WanderMap</h2>
            <p class="text-sm text-gray-500 mb-6">請輸入密碼以查看私人行程</p>
            <input type="password" id="app-password" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-center text-lg tracking-widest focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all mb-4" placeholder="••••" onkeypress="if(event.key === 'Enter') unlockApp()">
            <button onclick="unlockApp()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-colors shadow-md">解鎖進入</button>
        </div>
    </div>

    <!-- 頂部 Header -->
    <div class="bg-white px-4 py-3 flex justify-between items-center shadow-sm z-20 shrink-0">
        <h1 class="text-lg font-bold text-gray-800 flex items-center gap-2 cursor-pointer group" onclick="openTripManager()" title="切換行程">
            WanderMap 
            <div class="flex items-center gap-1 bg-blue-500 group-hover:bg-blue-600 transition-colors text-white px-2 py-0.5 rounded-full shadow-sm">
                <span id="header-trip-name" class="text-xs font-normal truncate max-w-[100px]">載入中...</span>
                <i class="fa-solid fa-caret-down text-[10px]"></i>
            </div>
        </h1>
        <div class="flex items-center gap-2">
            <button onclick="showApiKeyPrompt()" class="text-xs bg-amber-50 text-amber-600 hover:bg-amber-100 px-2 py-1.5 rounded-lg font-medium transition-colors border border-amber-200">
                <i class="fa-solid fa-key mr-1"></i>金鑰
            </button>
            <button onclick="requestResetData()" class="text-xs text-gray-500 hover:text-gray-700 px-2 py-1"><i class="fa-solid fa-rotate-right mr-1"></i>重設</button>
            <button onclick="lockApp()" class="text-xs bg-slate-100 text-slate-600 hover:bg-slate-200 px-2 py-1.5 rounded-lg font-medium transition-colors"><i class="fa-solid fa-lock mr-1"></i>上鎖</button>
        </div>
    </div>

    <!-- 地圖區域 -->
    <div id="map-container" class="w-full h-[35%] relative z-0"></div>

    <!-- 天數切換 Tab -->
    <div class="bg-white border-t border-b border-gray-200 shadow-sm z-20 shrink-0 relative">
        <div class="flex overflow-x-auto hide-scrollbar px-2 py-2 gap-2 items-center" id="tabs-container">
            <!-- Tabs 產生位置 -->
        </div>
    </div>

    <!-- 內容面板 -->
    <div class="flex-1 bg-slate-50 flex flex-col min-h-0 relative">
        
        <!-- 新增景點列 -->
        <div id="add-place-bar" class="px-3 py-3 bg-white border-b border-gray-200 flex flex-col gap-2 shrink-0 shadow-sm z-20">
            <div class="flex gap-2">
                <input type="text" id="new-place-name" placeholder="搜尋景點 (如: 美國村)" class="flex-1 bg-gray-50 border border-slate-300 text-sm rounded-lg px-3 py-2 outline-none focus:border-blue-500 transition-colors">
                <button onclick="addNewPlace()" class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-4 font-medium transition-colors shadow-sm whitespace-nowrap min-w-[70px]">搜尋</button>
            </div>
            <input type="text" id="new-place-note" placeholder="備註或營業時間 (選填)" class="w-full bg-gray-50 border border-slate-300 text-sm rounded-lg px-3 py-1.5 outline-none focus:border-blue-500 transition-colors" onkeypress="if(event.key === 'Enter') addNewPlace()">
        </div>

        <!-- 列表容器 -->
        <div id="itinerary-list" class="flex-1 overflow-y-auto px-4 py-4 safe-pb relative">
            <!-- 景點或備忘錄會產生在這裡 -->
        </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full text-sm shadow-lg z-[110] opacity-0 pointer-events-none transition-opacity duration-300 flex items-center gap-2">
        <i class="fa-solid fa-circle-info text-blue-400"></i><span id="toast-msg"></span>
    </div>

    <!-- 通用確認視窗 (取代 alert / confirm) -->
    <div id="confirm-modal" class="fixed inset-0 bg-black/50 z-[120] hidden items-center justify-center backdrop-blur-sm">
        <div class="bg-white p-6 rounded-2xl shadow-xl w-10/12 max-w-sm text-center">
            <div class="text-red-500 text-4xl mb-4"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <h3 id="confirm-title" class="text-lg font-bold text-gray-800 mb-2">確認動作？</h3>
            <p id="confirm-msg" class="text-sm text-gray-500 mb-6">此動作無法復原。</p>
            <div class="flex gap-3 justify-center">
                <button onclick="closeConfirm()" class="flex-1 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-medium transition-colors">取消</button>
                <button onclick="executeConfirm()" class="flex-1 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-xl font-medium transition-colors shadow-sm">確定</button>
            </div>
        </div>
    </div>

    <!-- 行程管理 Modal (解決 Q1) -->
    <div id="trip-manager-modal" class="fixed inset-0 bg-black/50 z-[80] hidden items-center justify-center backdrop-blur-sm">
        <div class="bg-white w-11/12 max-w-sm rounded-2xl shadow-xl flex flex-col max-h-[80vh]">
            <div class="px-4 py-3 border-b border-gray-100 flex justify-between items-center bg-gray-50 rounded-t-2xl">
                <h3 class="font-bold text-gray-800"><i class="fa-solid fa-suitcase-rolling mr-2 text-blue-500"></i>我的行程清單</h3>
                <button onclick="closeTripManager()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-3 overflow-y-auto flex-1 flex flex-col gap-2" id="trip-list-container">
                <!-- Trips rendered here -->
            </div>
            <div class="p-3 border-t border-gray-100 bg-gray-50 rounded-b-2xl">
                <p class="text-xs text-gray-500 mb-2 font-medium">建立新行程</p>
                <div class="flex gap-2">
                    <input type="text" id="new-trip-name" placeholder="名稱 (如: 東京自由行)" class="flex-1 bg-white border border-slate-300 text-sm rounded-lg px-3 py-2 outline-none focus:border-blue-500">
                    <button onclick="createNewTrip()" class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-4 text-sm font-medium transition-colors shadow-sm whitespace-nowrap">新增</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 自訂 API 金鑰輸入框 -->
    <div id="api-key-modal" class="fixed inset-0 bg-black/50 z-[70] hidden items-center justify-center backdrop-blur-sm">
        <div class="bg-white w-11/12 max-w-sm rounded-2xl shadow-xl overflow-hidden flex flex-col">
            <div class="bg-amber-50 px-4 py-3 border-b border-amber-100 flex justify-between items-center">
                <h3 class="font-bold text-amber-800"><i class="fa-solid fa-key mr-2"></i>設定 AI 金鑰</h3>
                <button onclick="closeApiKeyPrompt()" class="text-amber-500 hover:text-amber-700"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-4 flex flex-col gap-3 text-sm text-gray-600">
                <p>為了安全起見，AI 掃描功能需要使用您自己的 Google Gemini API 金鑰。該金鑰僅會加密儲存於您的設備中。</p>
                <input type="text" id="api-key-input" placeholder="AIzaSy..." class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:border-amber-500 font-mono text-xs">
                <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-blue-500 hover:underline text-xs"><i class="fa-solid fa-arrow-up-right-from-square mr-1"></i>取得免費 API 金鑰</a>
            </div>
            <div class="p-3 bg-gray-50 border-t border-gray-100 flex justify-end">
                <button onclick="saveApiKeyPrompt()" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition-colors text-sm">儲存設定</button>
            </div>
        </div>
    </div>

    <!-- 多選搜尋結果 Modal -->
    <div id="search-modal" class="fixed inset-0 bg-black/50 z-[70] hidden items-center justify-center backdrop-blur-sm">
        <div class="bg-white w-11/12 max-w-md rounded-2xl shadow-xl overflow-hidden flex flex-col max-h-[80vh]">
            <div class="bg-blue-600 px-4 py-3 flex justify-between items-center text-white">
                <h3 class="font-bold">找到多個地點</h3>
                <button onclick="closeSearchModal()" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-2 overflow-y-auto flex-1 bg-slate-50" id="search-results-container"></div>
        </div>
    </div>

    <script>
        const APP_PASSWORD = "1234";
        const DEFAULT_API_KEY = "";
        let map, routeLines = [], markers = [];
        let currentTab = -1; // -3:記帳, -2:備忘錄, -1:待安排, 0~N: Day1~DayN
        let editingPlaceId = null; 
        let pendingSearchData = null;
        let pendingConfirmAction = null;

        // 預設資料池
        const defaultPool = [
            { id: 101, name: "那霸機場", address: "沖縄県那覇市鏡水150", lat: 26.1994, lng: 127.6458, note: "抵達與離開沖繩的第一站", icon: "fa-plane-arrival", bg: "bg-blue-500", color: "text-white" },
            { id: 102, name: "Prince Smart Inn Naha", address: "沖縄県那覇市松山2-4-13", lat: 26.2201, lng: 127.6806, note: "五天連住。1F行李, 4F微波爐/製冰機, 5F洗衣。", icon: "fa-bed", bg: "bg-purple-500", color: "text-white" },
            { id: 103, name: "大創 Daiso (AEON那霸店)", address: "沖縄県那覇市金城5-10-2 AEON那霸店2F", lat: 26.1932, lng: 127.6625, note: "小祿站旁約10分鐘。適合大量採買便宜泡澡球(約100日圓)", icon: "fa-cart-shopping", bg: "bg-pink-500", color: "text-white" },
            { id: 104, name: "安次富文具店 (Office Pro)", address: "沖縄県那覇市牧志1丁目1-14", lat: 26.2166, lng: 127.6853, note: "買文具用品", icon: "fa-pen-ruler", bg: "bg-teal-500", color: "text-white" },
            { id: 105, name: "CARTOLERIA", address: "沖縄県那覇市久茂地1丁目1-1 Palette Kumoji 8F", lat: 26.2138, lng: 127.6789, note: "縣廳前站 Palette 8F，買文具", icon: "fa-pen-ruler", bg: "bg-teal-500", color: "text-white" },
            { id: 106, name: "國際通商圈", address: "沖縄県那覇市牧志", lat: 26.2155, lng: 127.6841, note: "買薯條三兄弟、藥妝(ok繃)。從飯店步行約 10 分鐘或搭單軌", icon: "fa-store", bg: "bg-red-500", color: "text-white" },
            { id: 107, name: "獅薩伴手禮店 (那霸機場)", address: "那霸機場內 2W-06區", lat: 26.2001, lng: 127.6450, note: "機場內隨意逛，回程可買", icon: "fa-gift", bg: "bg-pink-400", color: "text-white" },
            { id: 108, name: "西來院達摩寺", address: "沖縄県那覇市首里赤田町1-5-1", lat: 26.2173, lng: 127.7212, note: "首里城站走路10分鐘", icon: "fa-vihara", bg: "bg-red-700", color: "text-white" },
            { id: 109, name: "Shisa Cookie", address: "沖縄県那覇市松尾1丁目1-1", lat: 26.2144, lng: 127.6795, note: "縣政廳站 - 風獅爺造型曲奇餅", icon: "fa-cookie-bite", bg: "bg-yellow-600", color: "text-white" },
            { id: 110, name: "金澤壽司", address: "沖縄県那覇市久茂地1丁目1-1", lat: 26.2138, lng: 127.6789, note: "Palette Kumoji 內 (縣政廳站)", icon: "fa-fish", bg: "bg-orange-500", color: "text-white" },
            { id: 111, name: "Cream D 生甜甜圈", address: "沖縄県那覇市おもろまち", lat: 26.2241, lng: 127.6953, note: "歌町站走3-5分。11:00營業。抹茶/紅豆/青檸乳酪。容易賣光！", icon: "fa-circle-notch", bg: "bg-orange-400", color: "text-gray-800" },
            { id: 112, name: "白色麥當勞 (姬百合通壺屋店)", address: "沖縄県那覇市壺屋1丁目28-18", lat: 26.2117, lng: 127.6872, note: "朝聖特色白色麥當勞", icon: "fa-burger", bg: "bg-yellow-500", color: "text-white" },
            { id: 113, name: "吉野家 百合之姬通店", address: "沖縄県那覇市壺屋2丁目6-5", lat: 26.2081, lng: 127.6911, note: "吃飯", icon: "fa-bowl-rice", bg: "bg-orange-600", color: "text-white" }
        ];

        const defaultMemo = {
            todo: [ 
                {id:1, text:"買旅平險", done:false}, 
                {id:2, text:"買ESIM列印QRCode", done:false}, 
                {id:3, text:"換日幣70000", done:false},
                {id:4, text:"列印機票", done:false},
                {id:5, text:"申請入境VISA", done:false},
                {id:6, text:"加入外交部領事Line", done:false},
                {id:7, text:"買相片列印紙CP1500:KC-18IL (信用卡2x3尺寸)", done:false}
            ],
            docs: [ 
                {id:8, text:"護照", done:false}, 
                {id:9, text:"機票影本", done:false},
                {id:10, text:"ESIM", done:false},
                {id:11, text:"日幣現金", done:false},
                {id:12, text:"信用卡兩張", done:false}
            ],
            items: [ 
                {id:13, text:"行動電源、充電線、充電器", done:false}, 
                {id:14, text:"眼鏡盒", done:false},
                {id:15, text:"行李箱 + 行李套 + 手提行李袋", done:false},
                {id:16, text:"旅行組：洗臉/洗髮/牙膏/牙刷/保養", done:false}
            ],
            clothes: [ 
                {id:17, text:"短袖x5, 長褲x2, 外套x1", done:false}, 
                {id:18, text:"睡衣x1, 睡褲x1", done:false},
                {id:19, text:"內衣x5, 內褲x5, 襪子x5", done:false} 
            ]
        };

        const generateDefaultTrip = (tripName = "沖繩五日遊 (10/16-10/20) 🌺") => {
            return {
                id: 'trip_' + Date.now(),
                name: tripName,
                info: '🏨 住宿資訊：Prince Smart Inn Naha\n📍 地址：沖繩縣那霸市松山2-4-13\n\n【設施備註】\n1F 行李空間\n4F 自動販賣機 / 製冰器 / 微波爐\n5F 洗衣角（收費/2台）\n\n【交通建議】\n多善用「單軌電車 24 小時一日券」；\n前往美國村可至「縣廳前」或「那霸巴士總站」搭乘路線公車。', 
                unscheduled: JSON.parse(JSON.stringify(tripName.includes("沖繩") ? defaultPool : [])),
                days: [ [], [], [], [], [] ], // 預設 5 天
                memo: JSON.parse(JSON.stringify(defaultMemo)),
                expenses: []
            };
        };

        // 多行程架構
        let globalData = { activeTripId: null, trips: [] };
        let appState = null; 

        function initData() {
            // 使用 V7 版本確保這次更新能強制刷新資料
            const savedData = localStorage.getItem('wanderMapV7_Data');
            if (savedData) { 
                try { 
                    globalData = JSON.parse(savedData); 
                } catch(e) { console.error("Data parse error", e); } 
            }
            
            if (!globalData || !globalData.trips || globalData.trips.length === 0) {
                const initTrip = generateDefaultTrip();
                globalData = { activeTripId: initTrip.id, trips: [initTrip] };
            }

            // 設定當前 active state
            appState = globalData.trips.find(t => t.id === globalData.activeTripId);
            if (!appState) {
                appState = globalData.trips[0];
                globalData.activeTripId = appState.id;
            }
            
            document.getElementById('header-trip-name').innerText = appState.name;
        }

        function saveState() { 
            localStorage.setItem('wanderMapV7_Data', JSON.stringify(globalData)); 
            document.getElementById('header-trip-name').innerText = appState.name;
        }

        function saveState() { 
            localStorage.setItem('wanderMapV6_Data', JSON.stringify(globalData)); 
            document.getElementById('header-trip-name').innerText = appState.name;
        }

        function showMessage(msg, isError = false) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.className = `fixed bottom-10 left-1/2 -translate-x-1/2 px-4 py-2 rounded-full text-sm shadow-lg z-[110] flex items-center gap-2 transition-opacity duration-300 ${isError ? 'bg-red-600 text-white' : 'bg-gray-800 text-white'}`;
            t.style.opacity = '1'; t.style.pointerEvents = 'auto';
            setTimeout(() => { t.style.opacity = '0'; t.style.pointerEvents = 'none'; }, 3000);
        }

        // 自訂 Confirm 視窗 (取代原生 confirm)
        function showConfirm(title, msg, actionCallback) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-msg').innerText = msg;
            pendingConfirmAction = actionCallback;
            document.getElementById('confirm-modal').style.display = 'flex';
        }
        function closeConfirm() { document.getElementById('confirm-modal').style.display = 'none'; pendingConfirmAction = null; }
        function executeConfirm() {
            if (pendingConfirmAction) pendingConfirmAction();
            closeConfirm();
        }

        function requestResetData() {
            showConfirm("確定要重設App嗎？", "這將清空所有的行程與記帳紀錄，回到初始狀態。", () => {
                localStorage.removeItem('wanderMapV7_Data');
                location.reload();
            });
        }

        function checkLockStatus() {
            initData(); // 先初始化資料
            const unlocked = localStorage.getItem('wanderMap_Unlocked');
            if (unlocked !== 'true') {
                document.getElementById('lock-screen').style.display = 'flex';
                setTimeout(() => document.getElementById('lock-screen').style.opacity = '1', 10);
            } else {
                document.getElementById('lock-screen').style.display = 'none';
                initMap(); renderTabs(); renderItinerary();
            }
        }

        function unlockApp() {
            const pwd = document.getElementById('app-password').value;
            if (pwd === APP_PASSWORD) {
                localStorage.setItem('wanderMap_Unlocked', 'true');
                document.getElementById('lock-screen').style.opacity = '0';
                setTimeout(() => { document.getElementById('lock-screen').style.display = 'none'; initMap(); renderTabs(); renderItinerary(); }, 300);
            } else {
                showMessage('密碼錯誤！請重新輸入', true);
                document.getElementById('app-password').value = '';
            }
        }

        function lockApp() {
            localStorage.removeItem('wanderMap_Unlocked');
            document.getElementById('lock-screen').style.display = 'flex';
            setTimeout(() => document.getElementById('lock-screen').style.opacity = '1', 10);
            document.getElementById('app-password').value = '';
        }

        function openTripManager() {
            const container = document.getElementById('trip-list-container');
            container.innerHTML = '';
            globalData.trips.forEach(trip => {
                const isActive = trip.id === globalData.activeTripId;
                container.innerHTML += `
                    <div class="p-3 rounded-xl border flex items-center justify-between transition-colors ${isActive ? 'bg-blue-50 border-blue-200' : 'bg-white border-gray-100 hover:border-blue-100'}">
                        <div class="flex-1 cursor-pointer flex items-center gap-2" onclick="switchTrip('${trip.id}')">
                            <i class="fa-solid fa-location-dot ${isActive ? 'text-blue-500' : 'text-gray-300'}"></i>
                            <div>
                                <div class="font-bold text-sm ${isActive ? 'text-blue-800' : 'text-gray-700'}">${trip.name}</div>
                                <div class="text-[10px] text-gray-400">${trip.days.length} 天行程</div>
                            </div>
                        </div>
                        ${globalData.trips.length > 1 ? `
                            <button onclick="requestDeleteTrip('${trip.id}')" class="text-gray-300 hover:text-red-500 px-2 py-1"><i class="fa-solid fa-trash-can"></i></button>
                        ` : ''}
                    </div>
                `;
            });
            document.getElementById('trip-manager-modal').style.display = 'flex';
        }

        function closeTripManager() { document.getElementById('trip-manager-modal').style.display = 'none'; }

        function createNewTrip() {
            const nameInput = document.getElementById('new-trip-name');
            const name = nameInput.value.trim() || '未命名行程';
            const newTrip = generateDefaultTrip(name);
            globalData.trips.push(newTrip);
            nameInput.value = '';
            saveState(); openTripManager(); // 刷新列表
            showMessage("已建立新行程！");
        }

        function switchTrip(id) {
            globalData.activeTripId = id;
            appState = globalData.trips.find(t => t.id === id);
            currentTab = -1; // 預設跳回待安排
            saveState(); closeTripManager();
            renderTabs(); renderItinerary();
            showMessage(`已切換至 ${appState.name}`);
        }

        function requestDeleteTrip(id) {
            showConfirm("刪除行程", "確定要刪除這個行程嗎？", () => {
                globalData.trips = globalData.trips.filter(t => t.id !== id);
                if (globalData.activeTripId === id) {
                    globalData.activeTripId = globalData.trips[0].id;
                    appState = globalData.trips[0];
                    currentTab = -1;
                }
                saveState(); openTripManager();
                renderTabs(); renderItinerary();
                showMessage("已刪除行程");
            });
        }

        function initMap() {
            if (map) return;
            map = L.map('map-container', { zoomControl: false }).setView([26.2123, 127.6792], 13);
            L.control.zoom({ position: 'bottomright' }).addTo(map);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO'
            }).addTo(map);
        }

        function updateMap(places) {
            if (!map) return;
            routeLines.forEach(line => map.removeLayer(line)); routeLines = [];
            markers.forEach(m => map.removeLayer(m)); markers = [];

            if (places.length === 0) return;

            const latlngs = places.map(p => [p.lat, p.lng]);
            const bounds = L.latLngBounds(latlngs);

            if (currentTab >= 0) { // 只有真實行程才連線
                const polyline = L.polyline(latlngs, { color: '#3b82f6', weight: 4, opacity: 0.7, className: 'map-line' }).addTo(map);
                routeLines.push(polyline);
            }

            places.forEach((place, index) => {
                const label = currentTab >= 0 ? (index + 1) : '<i class="fa-solid ' + place.icon + '"></i>';
                const iconHtml = `<div class="w-8 h-8 ${place.bg || 'bg-blue-600'} text-white rounded-full flex items-center justify-center font-bold shadow-md border-2 border-white ring-1 ring-black/10">${label}</div>`;
                const customIcon = L.divIcon({ className: 'custom-div-icon', html: iconHtml, iconSize: [32, 32], iconAnchor: [16, 16] });
                const marker = L.marker([place.lat, place.lng], { icon: customIcon }).addTo(map);
                
                let popupContent = `<b>${place.name}</b><br><span style="font-size:10px;color:gray">${place.address||''}</span>`;
                if(place.note) popupContent += `<br><span style="font-size:11px;color:#666">${place.note}</span>`;
                marker.bindPopup(popupContent);
                
                marker.on('click', () => {
                    const el = document.getElementById('place-inner-' + place.id);
                    if (el) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        el.classList.remove('highlight-card');
                        void el.offsetWidth;
                        el.classList.add('highlight-card');
                    }
                });
                markers.push(marker);
            });
            map.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
        }

        function renderTabs() {
            const container = document.getElementById('tabs-container');
            let html = '';
            
            // 待安排 Tab
            const unCount = appState.unscheduled.length;
            html += `<button onclick="switchTab(-1)" class="px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition-colors flex items-center gap-1 shrink-0 ${currentTab === -1 ? 'bg-amber-500 text-white shadow-sm' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'}">
                        <i class="fa-solid fa-thumbtack text-xs"></i>待安排 (${unCount})
                     </button>`;

            // 動態 Day 產生 (解決 Q2)
            appState.days.forEach((day, index) => {
                const isActive = currentTab === index;
                html += `<button onclick="switchTab(${index})" class="px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition-colors flex items-center gap-1 shrink-0 ${isActive ? 'bg-blue-600 text-white shadow-sm' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'}">
                            Day ${index + 1} (${day.length})
                         </button>`;
            });

            // 新增天數按鈕 (解決 Q2)
            html += `<button onclick="addDay()" class="px-3 py-1.5 rounded-full text-sm font-bold text-blue-500 bg-blue-50 border border-dashed border-blue-200 hover:bg-blue-100 transition-colors flex items-center shrink-0" title="增加一天">
                        <i class="fa-solid fa-plus"></i>
                     </button>`;

            // 旅遊備忘錄 Tab
            html += `<button onclick="switchTab(-2)" class="px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition-colors flex items-center gap-1 shrink-0 ml-2 ${currentTab === -2 ? 'bg-pink-500 text-white shadow-sm' : 'bg-pink-50 text-pink-600 border border-pink-200 hover:bg-pink-100'}">
                        <i class="fa-solid fa-clipboard-list"></i>備忘錄
                     </button>`;
            
            // 記帳本 Tab
            html += `<button onclick="switchTab(-3)" class="px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition-colors flex items-center gap-1 shrink-0 ${currentTab === -3 ? 'bg-green-600 text-white shadow-sm' : 'bg-green-50 text-green-700 border border-green-200 hover:bg-green-100'}">
                        <i class="fa-solid fa-wallet"></i>記帳本
                     </button>`;

            container.innerHTML = html;
        }

        // 動態增加天數功能 (解決 Q2)
        function addDay() {
            appState.days.push([]);
            saveState();
            renderTabs();
            // 自動切換到最新的一天
            switchTab(appState.days.length - 1);
            showMessage(`已新增 Day ${appState.days.length}`);
            
            // 滾動 tab 容器到最右邊
            const tabContainer = document.getElementById('tabs-container');
            setTimeout(() => { tabContainer.scrollLeft = tabContainer.scrollWidth; }, 50);
        }

        function switchTab(index) {
            currentTab = index;
            editingPlaceId = null;
            const bar = document.getElementById('add-place-bar');
            const mapContainer = document.getElementById('map-container');
            
            if (index === -2 || index === -3) { 
                bar.style.display = 'none'; 
                mapContainer.style.display = 'none'; // 隱藏地圖
                updateMap([]); 
            } else { 
                bar.style.display = 'flex'; 
                mapContainer.style.display = 'block'; // 顯示地圖
                if (map) { setTimeout(() => { map.invalidateSize(); }, 100); }
            }
            renderTabs(); renderItinerary();
        }

        async function addNewPlace() {
            const name = document.getElementById('new-place-name').value.trim();
            const note = document.getElementById('new-place-note').value.trim();
            if (!name) return;

            document.getElementById('new-place-name').value = '搜尋中...';
            document.getElementById('new-place-name').disabled = true;

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(name)}&limit=5`);
                const data = await response.json();

                document.getElementById('new-place-name').value = '';
                document.getElementById('new-place-name').disabled = false;

                if (data && data.length > 1) {
                    pendingSearchData = { name, note };
                    showSearchModal(data);
                } else if (data && data.length === 1) {
                    confirmAddPlace(name, data[0].display_name, parseFloat(data[0].lat), parseFloat(data[0].lon), note);
                } else {
                    showMessage(`找不到精確地標，已加入清單。請手動編輯地址！`, true);
                    confirmAddPlace(name, "請點擊 ✏️ 輸入真實地址", 26.2123, 127.6792, note);
                }
            } catch (err) {
                document.getElementById('new-place-name').value = '';
                document.getElementById('new-place-name').disabled = false;
                showMessage('網路異常，已加入清單。', true);
                confirmAddPlace(name, "", 26.2123, 127.6792, note);
            }
        }

        function showSearchModal(results) {
            const container = document.getElementById('search-results-container');
            let html = '<p class="text-xs text-gray-500 mb-2 px-1">請選擇你要加入的精確位置：</p>';
            results.forEach((r, idx) => {
                const nameMatch = r.display_name.split(',')[0];
                html += `
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 mb-2 cursor-pointer hover:border-blue-300 transition-colors" onclick="selectSearchResult(${idx})">
                        <div class="font-bold text-sm text-gray-800">${nameMatch}</div>
                        <div class="text-[11px] text-gray-500 mt-1 line-clamp-2"><i class="fa-solid fa-location-dot mr-1"></i>${r.display_name}</div>
                    </div>`;
            });
            container.innerHTML = html;
            window.tempSearchResults = results;
            document.getElementById('search-modal').style.display = 'flex';
        }

        function closeSearchModal() { document.getElementById('search-modal').style.display = 'none'; pendingSearchData = null; window.tempSearchResults = null; }

        function selectSearchResult(idx) {
            const r = window.tempSearchResults[idx];
            if (r && pendingSearchData) {
                confirmAddPlace(pendingSearchData.name, r.display_name, parseFloat(r.lat), parseFloat(r.lon), pendingSearchData.note);
            }
            closeSearchModal();
        }

        function confirmAddPlace(name, address, lat, lng, note) {
            const newPlace = {
                id: Date.now(), name: name, address: address, lat: lat, lng: lng, note: note,
                icon: "fa-location-dot", bg: "bg-blue-500", color: "text-white"
            };
            if (currentTab === -1) appState.unscheduled.push(newPlace);
            else appState.days[currentTab].push(newPlace);
            
            document.getElementById('new-place-note').value = '';
            saveState(); renderTabs(); renderItinerary();
            showMessage(`已新增景點：${name}`);
        }

        function moveToTab(fromTab, index, toTab) {
            const fromList = fromTab === -1 ? appState.unscheduled : appState.days[fromTab];
            const toList = toTab === -1 ? appState.unscheduled : appState.days[toTab];
            const item = fromList.splice(index, 1)[0];
            toList.push(item);
            saveState(); renderTabs(); renderItinerary(); showMessage("已移動景點！");
        }

        function reorderItem(tab, index, direction) {
            const list = tab === -1 ? appState.unscheduled : appState.days[tab];
            if (index + direction < 0 || index + direction >= list.length) return;
            const temp = list[index];
            list[index] = list[index + direction];
            list[index + direction] = temp;
            saveState(); renderItinerary();
        }

        function deleteItem(tab, index) {
            const list = tab === -1 ? appState.unscheduled : appState.days[tab];
            list.splice(index, 1);
            saveState(); renderTabs(); renderItinerary(); showMessage("已刪除景點！");
        }

        function cloneItem(tab, index) {
            const list = tab === -1 ? appState.unscheduled : appState.days[tab];
            const originalItem = list[index];
            const clonedItem = { ...originalItem, id: Date.now() }; 
            list.splice(index + 1, 0, clonedItem); 
            saveState(); renderTabs(); renderItinerary(); showMessage("已複製景點！");
        }

        function startEditPlace(id) { editingPlaceId = id; renderItinerary(); }
        function cancelEditPlace() { editingPlaceId = null; renderItinerary(); }
        function saveEditPlace(tab, index, id) {
            const newName = document.getElementById(`edit-place-name-${id}`).value.trim();
            const newAddress = document.getElementById(`edit-place-address-${id}`).value.trim();
            const newNote = document.getElementById(`edit-place-note-${id}`).value.trim();
            if (!newName) { showMessage("景點名稱不能為空！", true); return; }

            let list = tab === -1 ? appState.unscheduled : appState.days[tab];
            list[index].name = newName;
            list[index].address = newAddress;
            list[index].note = newNote;
            editingPlaceId = null; saveState(); renderItinerary(); showMessage("景點更新成功！");
        }

        function getNavUrl(from, to, mode) {
            return `https://www.google.com/maps/dir/?api=1&origin=${from.lat},${from.lng}&destination=${to.lat},${to.lng}&travelmode=${mode}`;
        }

        function renderItinerary() {
            const listElement = document.getElementById('itinerary-list');
            if (currentTab === -2) { renderMemo(); return; }
            if (currentTab === -3) { renderExpenses(); return; }

            const places = currentTab === -1 ? appState.unscheduled : appState.days[currentTab];
            listElement.innerHTML = '';
            
            if (places.length === 0) {
                listElement.innerHTML = `<div class="flex flex-col items-center justify-center h-40 text-gray-400 gap-3"><i class="fa-solid fa-folder-open text-4xl"></i><p>這裡目前沒有行程喔</p></div>`;
                updateMap([]); return;
            }

            let html = '<div class="relative pl-6 before:absolute before:inset-0 before:ml-[34px] before:w-0.5 before:bg-gray-200 before:z-0">';
            
            places.forEach((place, index) => {
                html += `
                <div class="relative flex mb-4 items-stretch group" id="place-row-${place.id}">
                    <div class="flex flex-col items-center z-10 w-[40px] shrink-0">
                        <div class="w-10 h-10 rounded-full ${place.bg || 'bg-blue-500'} ${place.color || 'text-white'} flex justify-center items-center shadow-sm border-2 border-white ring-1 ring-gray-100 z-10">
                            ${currentTab === -1 ? '<i class="fa-solid fa-thumbtack text-sm"></i>' : `<span class="font-bold text-sm">${index + 1}</span>`}
                        </div>
                    </div>
                    
                    <div class="flex-1 bg-white border border-gray-100 p-3.5 rounded-2xl shadow-sm relative z-10 mb-2 transition-all duration-300 hover:shadow-md" id="place-inner-${place.id}">
                        ${editingPlaceId === place.id ? `
                            <div class="flex flex-col gap-2">
                                <input type="text" id="edit-place-name-${place.id}" value="${place.name}" class="w-full bg-white border border-slate-300 text-sm font-bold rounded px-2 py-1.5 outline-none focus:border-blue-500" placeholder="景點名稱 (必填)">
                                <input type="text" id="edit-place-address-${place.id}" value="${place.address || ''}" class="w-full bg-gray-50 border border-slate-200 text-[11px] text-gray-600 rounded px-2 py-1 outline-none focus:border-blue-500" placeholder="真實地址">
                                <textarea id="edit-place-note-${place.id}" class="w-full bg-gray-50 border border-slate-200 text-xs text-gray-600 rounded px-2 py-1.5 outline-none focus:border-blue-500 resize-none h-16" placeholder="備註或營業時間 (選填)">${place.note || ''}</textarea>
                                <div class="flex justify-end gap-2 mt-1 border-t border-gray-50 pt-2">
                                    <button onclick="cancelEditPlace()" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg text-xs font-medium transition-colors">取消</button>
                                    <button onclick="saveEditPlace(${currentTab}, ${index}, ${place.id})" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-medium transition-colors shadow-sm">儲存設定</button>
                                </div>
                            </div>
                        ` : `
                            <div class="flex justify-between items-start">
                                <h3 class="font-bold text-gray-800 text-base leading-tight">${place.name}</h3>
                                <div class="flex gap-1">
                                    <button onclick="startEditPlace(${place.id})" class="text-gray-300 hover:text-blue-500 transition-colors p-1" title="編輯名稱"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick="cloneItem(${currentTab}, ${index})" class="text-gray-300 hover:text-blue-500 transition-colors p-1" title="複製景點"><i class="fa-regular fa-copy"></i></button>
                                    <button onclick="deleteItem(${currentTab}, ${index})" class="text-gray-300 hover:text-red-500 transition-colors p-1" title="刪除景點"><i class="fa-solid fa-xmark"></i></button>
                                </div>
                            </div>
                            ${place.address ? `<div class="mt-1 text-[11px] text-gray-500 leading-snug line-clamp-2"><i class="fa-solid fa-location-dot mr-1"></i>${place.address}</div>` : ''}
                            ${place.note ? `<div class="mt-2 text-xs text-gray-600 bg-gray-50 p-2 rounded-lg border border-gray-100 leading-relaxed"><i class="fa-solid fa-circle-info text-blue-400 mr-1.5"></i>${place.note}</div>` : ''}
                            
                            <div class="flex justify-between items-center mt-3 pt-2 border-t border-gray-50">
                                <div class="flex gap-1">
                                    <button onclick="reorderItem(${currentTab}, ${index}, -1)" class="w-7 h-7 flex items-center justify-center bg-gray-50 hover:bg-gray-200 rounded text-gray-500 transition-colors" ${index === 0 ? 'disabled style="opacity:0.3"' : ''}><i class="fa-solid fa-arrow-up text-xs"></i></button>
                                    <button onclick="reorderItem(${currentTab}, ${index}, 1)" class="w-7 h-7 flex items-center justify-center bg-gray-50 hover:bg-gray-200 rounded text-gray-500 transition-colors" ${index === places.length - 1 ? 'disabled style="opacity:0.3"' : ''}><i class="fa-solid fa-arrow-down text-xs"></i></button>
                                </div>
                                <select onchange="moveToTab(${currentTab}, ${index}, parseInt(this.value))" class="text-xs bg-blue-50 text-blue-600 border border-blue-100 rounded outline-none py-1 px-1">
                                    <option value="" disabled selected>移至...</option>
                                    <option value="-1">待安排</option>
                                    ${appState.days.map((_, i) => `<option value="${i}">Day ${i + 1}</option>`).join('')}
                                </select>
                            </div>
                        `}
                    </div>
                </div>`;

                if (index < places.length - 1 && currentTab >= 0) {
                    const nextPlace = places[index + 1];
                    html += `
                    <div class="flex pl-[50px] mb-4 relative z-10 group -mt-4">
                        <div class="bg-white border border-gray-200 shadow-sm rounded-full py-1.5 px-3 flex gap-4 text-[11px] font-medium text-gray-500 hover:shadow-md hover:border-blue-300 transition-all">
                            <a href="${getNavUrl(place, nextPlace, 'driving')}" target="_blank" class="hover:text-blue-600 flex items-center gap-1"><i class="fa-solid fa-car text-blue-500"></i>開車</a>
                            <div class="w-px bg-gray-200"></div>
                            <a href="${getNavUrl(place, nextPlace, 'transit')}" target="_blank" class="hover:text-green-600 flex items-center gap-1"><i class="fa-solid fa-train-subway text-green-500"></i>大眾</a>
                            <div class="w-px bg-gray-200"></div>
                            <a href="${getNavUrl(place, nextPlace, 'walking')}" target="_blank" class="hover:text-orange-600 flex items-center gap-1"><i class="fa-solid fa-person-walking text-orange-500"></i>步行</a>
                        </div>
                    </div>`;
                }
            });
            html += '</div>';
            listElement.innerHTML = html;
            updateMap(places);
        }

        function saveTripInfo(val) {
            appState.info = val;
            saveState();
        }

        function toggleMemoDone(category, index) { appState.memo[category][index].done = !appState.memo[category][index].done; saveState(); renderMemo(); }
        function editMemoText(category, index) {
            const currentText = appState.memo[category][index].text;
            const newText = prompt("修改備忘錄內容：", currentText);
            if (newText && newText.trim() !== "") { appState.memo[category][index].text = newText.trim(); saveState(); renderMemo(); }
        }
        function addMemoItem(category) {
            const text = prompt("新增備忘錄項目：");
            if (text && text.trim() !== "") { appState.memo[category].push({ id: Date.now(), text: text.trim(), done: false }); saveState(); renderMemo(); }
        }
        function deleteMemoItem(category, index) { appState.memo[category].splice(index, 1); saveState(); renderMemo(); }
        
        function renderMemoGroup(title, icon, color, category, items) {
            let html = `<div class="mb-5 bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                <h3 class="font-bold text-gray-800 flex items-center gap-2 mb-3 border-b border-gray-50 pb-2"><i class="fa-solid ${icon} ${color}"></i>${title}</h3>
                <div class="flex flex-col gap-2">`;
            items.forEach((item, index) => {
                html += `<div class="flex items-start gap-3 group">
                    <button onclick="toggleMemoDone('${category}', ${index})" class="mt-0.5 text-lg ${item.done ? 'text-green-500' : 'text-gray-300'} hover:text-green-400 transition-colors"><i class="fa-solid ${item.done ? 'fa-square-check' : 'fa-square'}"></i></button>
                    <div class="flex-1 text-sm ${item.done ? 'text-gray-400 line-through' : 'text-gray-700'} cursor-pointer" onclick="editMemoText('${category}', ${index})">${item.text}</div>
                    <button onclick="deleteMemoItem('${category}', ${index})" class="text-gray-200 hover:text-red-500 transition-colors px-1"><i class="fa-solid fa-trash-can text-xs"></i></button>
                </div>`;
            });
            html += `<button onclick="addMemoItem('${category}')" class="mt-2 text-xs text-blue-500 hover:text-blue-700 flex items-center gap-1 font-medium"><i class="fa-solid fa-plus"></i>新增項目</button></div></div>`;
            return html;
        }

        function renderMemo() {
            // 行前與住宿資訊 (解決 Q3)
            let html = `
                <div class="mb-5 bg-blue-50 p-4 rounded-2xl shadow-sm border border-blue-100">
                    <h3 class="font-bold text-blue-800 flex items-center gap-2 mb-3"><i class="fa-solid fa-hotel text-blue-500"></i>行前資訊與備忘錄</h3>
                    <textarea class="w-full bg-white/80 border border-blue-200 text-sm text-gray-700 rounded-lg px-3 py-2 outline-none focus:border-blue-400 focus:bg-white resize-y min-h-[120px] transition-colors" placeholder="請輸入住宿地址、大門密碼、交通建議等重要資訊... (離開焦點自動存檔)" onblur="saveTripInfo(this.value)">${appState.info || ''}</textarea>
                </div>`;
            
            html += `<div class="mb-4 text-[13px] text-gray-500 bg-gray-100/50 p-3 rounded-xl border border-gray-200"><i class="fa-solid fa-lightbulb text-amber-500 mr-2"></i>點擊文字可以修改內容，所有紀錄會自動儲存。</div>`;
            
            // 待辦清單
            html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
            html += renderMemoGroup("旅遊待辦清單", "fa-list-check", "text-blue-500", "todo", appState.memo.todo);
            html += renderMemoGroup("行李檢查表", "fa-suitcase", "text-purple-500", "items", appState.memo.items);
            html += `</div>`;
            
            document.getElementById('itinerary-list').innerHTML = html;
        }

        const expenseCategories = {
            'food': { icon: 'fa-utensils', name: '飲食', color: 'text-orange-500', bg: 'bg-orange-100' },
            'transport': { icon: 'fa-train-subway', name: '交通', color: 'text-blue-500', bg: 'bg-blue-100' },
            'shopping': { icon: 'fa-bag-shopping', name: '購物', color: 'text-pink-500', bg: 'bg-pink-100' },
            'stay': { icon: 'fa-bed', name: '住宿', color: 'text-purple-500', bg: 'bg-purple-100' },
            'play': { icon: 'fa-ticket', name: '娛樂', color: 'text-teal-500', bg: 'bg-teal-100' }
        };

        function showApiKeyPrompt() { document.getElementById('api-key-input').value = localStorage.getItem('wanderMap_ApiKey') || ''; document.getElementById('api-key-modal').style.display = 'flex'; }
        function closeApiKeyPrompt() { document.getElementById('api-key-modal').style.display = 'none'; }
        function saveApiKeyPrompt() {
            const key = document.getElementById('api-key-input').value.trim();
            if(key) { localStorage.setItem('wanderMap_ApiKey', key); showMessage('金鑰已儲存！'); }
            else { localStorage.removeItem('wanderMap_ApiKey'); showMessage('金鑰已清除！'); }
            closeApiKeyPrompt();
        }
        function getApiKey() { return localStorage.getItem('wanderMap_ApiKey') || DEFAULT_API_KEY; }

        function triggerCamera() { const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment'; input.onchange = (e) => handleImageUpload(e.target.files[0]); input.click(); }
        function triggerGallery() { const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*'; input.onchange = (e) => handleImageUpload(e.target.files[0]); input.click(); }

        async function handleImageUpload(file) {
            if (!file) return;
            const apiKey = getApiKey();
            if (!apiKey) { showApiKeyPrompt(); return; }

            showMessage('📸 AI 正在讀取收據中...');
            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64Image = e.target.result.split(',')[1];
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [
                                { text: "請分析這張日文收據，抓出以下資訊並嚴格以JSON格式回傳（不要加上markdown標記）：\n1. 店名與所有細項合併成一個字串 (例如：'牛たん炭焼 利久 (牛たん定食, ウーロン茶)')\n2. 最終含稅總金額 (純數字)\n格式：{\"name\": \"組合後的名稱\", \"amount\": 總金額數字}" },
                                { inline_data: { mime_type: file.type, data: base64Image } }
                            ]}]
                        })
                    });
                    if (!response.ok) throw new Error('API Request Failed');
                    const data = await response.json();
                    let resultText = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
                    const result = JSON.parse(resultText);

                    document.getElementById('exp-name').value = result.name || '';
                    document.getElementById('exp-amount').value = result.amount || '';
                    showMessage('✅ AI 辨識完成！');
                } catch (error) {
                    console.error(error); showMessage('❌ 掃描失敗，請手動輸入或檢查金鑰', true);
                }
            };
            reader.readAsDataURL(file);
        }

        function addExpense() {
            const name = document.getElementById('exp-name').value.trim();
            const amount = parseInt(document.getElementById('exp-amount').value);
            const cat = document.getElementById('exp-cat').value;
            if (!name || isNaN(amount)) { showMessage('請輸入正確的名稱與金額', true); return; }
            appState.expenses.unshift({ id: Date.now(), name, amount, cat, date: new Date().toLocaleDateString() });
            saveState(); renderExpenses(); showMessage('已記一筆！');
        }

        function deleteExpense(index) { appState.expenses.splice(index, 1); saveState(); renderExpenses(); showMessage('已刪除紀錄'); }

        let editingExpenseIndex = -1;
        function startEditExpense(index) { editingExpenseIndex = index; renderExpenses(); }
        function saveEditExpense(index) {
            const name = document.getElementById(`edit-exp-name-${index}`).value.trim();
            const amount = parseInt(document.getElementById(`edit-exp-amount-${index}`).value);
            if (!name || isNaN(amount)) { showMessage('格式錯誤', true); return; }
            appState.expenses[index].name = name; appState.expenses[index].amount = amount;
            editingExpenseIndex = -1; saveState(); renderExpenses(); showMessage('更新成功');
        }

        function renderExpenses() {
            const total = appState.expenses.reduce((sum, exp) => sum + exp.amount, 0);
            let html = `
                <div class="bg-gradient-to-br from-green-500 to-emerald-600 rounded-2xl p-5 text-white shadow-md mb-4 relative overflow-hidden">
                    <i class="fa-solid fa-coins absolute -right-4 -bottom-4 text-7xl text-white opacity-20"></i>
                    <div class="text-green-100 text-sm mb-1">本行程旅費總計</div>
                    <div class="text-3xl font-bold font-mono">¥ ${total.toLocaleString()}</div>
                </div>

                <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 mb-5">
                    <div class="flex justify-between items-center mb-3">
                        <div class="font-bold text-gray-700 text-sm">新增花費</div>
                        <div class="flex gap-2">
                            <button onclick="triggerCamera()" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-2 py-1 rounded-lg transition-colors flex items-center gap-1"><i class="fa-solid fa-camera"></i>拍照</button>
                            <button onclick="triggerGallery()" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-2 py-1 rounded-lg transition-colors flex items-center gap-1"><i class="fa-solid fa-image"></i>相簿</button>
                        </div>
                    </div>
                    <div class="flex flex-col gap-2">
                        <div class="flex gap-2">
                            <select id="exp-cat" class="bg-gray-50 border border-gray-200 rounded-lg px-2 text-sm outline-none">
                                ${Object.entries(expenseCategories).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join('')}
                            </select>
                            <input type="text" id="exp-name" placeholder="項目名稱 (可AI掃描)" class="flex-1 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-green-500">
                        </div>
                        <div class="flex gap-2">
                            <div class="relative flex-1">
                                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 font-mono">¥</span>
                                <input type="number" id="exp-amount" placeholder="0" class="w-full bg-gray-50 border border-gray-200 rounded-lg pl-8 pr-3 py-2 text-sm outline-none focus:border-green-500 font-mono" onkeypress="if(event.key === 'Enter') addExpense()">
                            </div>
                            <button onclick="addExpense()" class="bg-green-600 hover:bg-green-700 text-white rounded-lg px-4 font-bold whitespace-nowrap shadow-sm">記一筆</button>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col gap-3 pb-6">`;
            
            if (appState.expenses.length === 0) {
                html += `<div class="text-center text-gray-400 py-6 text-sm">還沒有任何花費紀錄喔！</div>`;
            } else {
                appState.expenses.forEach((exp, index) => {
                    const cat = expenseCategories[exp.cat] || expenseCategories.food;
                    html += `
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex items-center gap-3">
                        <div class="w-10 h-10 ${cat.bg} ${cat.color} rounded-full flex items-center justify-center shrink-0"><i class="fa-solid ${cat.icon}"></i></div>
                        <div class="flex-1 min-w-0">
                            ${editingExpenseIndex === index ? `
                                <input type="text" id="edit-exp-name-${index}" value="${exp.name}" class="w-full text-sm font-bold border-b border-gray-300 outline-none mb-1">
                                <input type="number" id="edit-exp-amount-${index}" value="${exp.amount}" class="w-20 text-xs border-b border-gray-300 outline-none text-red-500 font-mono">
                            ` : `
                                <div class="font-bold text-gray-800 text-sm truncate">${exp.name}</div>
                                <div class="text-[11px] text-gray-400">${exp.date}</div>
                            `}
                        </div>
                        ${editingExpenseIndex === index ? `
                            <button onclick="saveEditExpense(${index})" class="text-green-500 hover:text-green-600 p-2"><i class="fa-solid fa-check"></i></button>
                        ` : `
                            <div class="font-mono font-bold text-red-500 text-sm mr-1">¥ ${exp.amount.toLocaleString()}</div>
                            <button onclick="startEditExpense(${index})" class="text-gray-300 hover:text-blue-500 p-1"><i class="fa-solid fa-pen text-xs"></i></button>
                            <button onclick="deleteExpense(${index})" class="text-gray-300 hover:text-red-500 p-1"><i class="fa-solid fa-trash-can text-xs"></i></button>
                        `}
                    </div>`;
                });
            }
            html += '</div>';
            document.getElementById('itinerary-list').innerHTML = html;
        }

        window.onload = checkLockStatus;
    </script>
</body>
</html>
